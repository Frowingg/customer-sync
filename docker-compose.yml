services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  legacy:
    build:
      context: .
      dockerfile: src/Legacy.CustomerService/Dockerfile
    ports:
      - "5001:8080"

  api:
    build:
      context: .
      dockerfile: src/CustomerSync.Api/Dockerfile
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=CustomerSync;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      LegacyService__Url: "http://legacy:8080/CustomerService.svc"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      legacy:
        condition: service_started

volumes:
  sqldata:
